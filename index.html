<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4efe3">
  <meta name="description" content="《水路通到家》广东文旅宣传片的创意、15 段分镜、取景素材和拍摄预算。">
  <meta name="robots" content="noindex, nofollow">
  <title>水路通到家 · 分镜与素材</title>
  <link rel="stylesheet" href="style.css?v=cf2e03287f9d">
  <script src="data.js?v=bc31c3d5b1ca" defer></script>
  <script src="districts.js?v=c883a554668a" defer></script>
  <script src="map.js?v=9364af8c3e44" defer></script>
  <script src="stage.js?v=a63e03e611e4" defer></script>
  <script src="app.js?v=199938eaaa44" defer></script>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="#cover" aria-label="水路通到家，回到开场"><span class="seal" aria-hidden="true">粤</span><span>水路通到家</span></a>
    <nav class="nav" aria-label="页面导航">
      <a id="mapTab" href="#map">取景地图</a>
      <a id="proposalTab" href="#proposal">创意与文案</a>
      <a id="storyTab" href="#script">完整脚本</a>
      <a id="productionTab" href="#production">拍摄预算</a>
      <a id="sourcesTab" href="#sources">素材总表</a>
      <button id="fullscreen" class="fullscreen" type="button">全屏</button>
    </nav>
  </header>
  <div class="stage" data-mode="intro">
    <div class="map-camera" inert>
      <canvas class="province-fill" aria-hidden="true"></canvas>
      <canvas class="district-highlight" aria-hidden="true"></canvas>
      <div class="map-labels"></div>
    </div>
    <div class="stage-media" aria-hidden="true"></div>
  </div>
  <main id="main"></main>
  <dialog id="detail" class="detail" aria-labelledby="detail-title">
    <form method="dialog" class="detail-bar"><button type="submit" autofocus>关闭</button></form>
    <div class="detail-content"></div>
  </dialog>
  <aside id="scene-note" class="scene-note" aria-label="编导说明" hidden></aside>
  <aside class="scene-credit" aria-label="背景画面来源" hidden></aside>
  <footer id="controls" class="controls" hidden aria-label="分镜导航"></footer>
  <noscript>这个网页需要启用 JavaScript 才能翻阅分镜和素材。</noscript>

</html>
